language = "C"
header = """
/*
 * PhoenixDB - C ABI
 *
 * THIS FILE IS AUTO-GENERATED BY cbindgen FROM build.rs. DO NOT EDIT BY HAND.
 *
 * Memory ownership rules:
 *   - Every pointer returned by this library is owned by PhoenixDB and MUST be
 *     released with the matching `phoenix_*_free` function.
 *   - Every pointer passed *into* this library is borrowed for the duration of
 *     the call only; the library never retains it.
 */
"""
include_guard = "PHOENIXDB_H"
pragma_once = true
autogen_warning = "/* Generated with cbindgen. Regenerate with `cargo build`. */"
include_version = true
cpp_compat = true
tab_width = 4
documentation = true
documentation_style = "doxy"
line_length = 100
style = "type"
no_includes = false
sys_includes = ["stdint.h", "stddef.h", "stdbool.h"]

[export]
prefix = ""
include = ["PhoenixStatus"]
item_types = ["enums", "structs", "opaque", "functions", "constants", "typedefs"]

[export.rename]
"PhoenixDbHandle" = "PhoenixDB"

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"

[parse]
parse_deps = false

[fn]
sort_by = "None"
args = "horizontal"

[defines]
