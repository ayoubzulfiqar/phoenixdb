name: phoenixdb
description: >-
  ACID-compliant embedded database for Dart and Flutter. B+Tree storage with
  MVCC transactions and a write-ahead log, written in Rust with dart:ffi.
  Optional SQL and a shared_preferences-style typed API.
version: 2.0.0
repository: https://github.com/ayoubzulfiqar/phoenixdb
issue_tracker: https://github.com/ayoubzulfiqar/phoenixdb/issues
documentation: https://github.com/ayoubzulfiqar/phoenixdb#readme

topics:
  - database
  - key-value
  - ffi
  - storage
  - sql

# Dart-only consumers (`dart pub add phoenixdb`) get the same package; the
# loader in lib/src/bindings.dart finds the native library on disk. Flutter
# consumers additionally get the platform folders below, which bundle or build
# the native library as part of the app.
#
# There is deliberately no `flutter:` constraint here. Declaring one makes the
# whole package require the Flutter SDK, so `dart pub get` fails with
# "Because phoenixdb requires the Flutter SDK, version solving failed" — even
# though nothing under lib/ imports package:flutter. Flutter support comes
# from the `flutter: plugin:` section below, which plain Dart ignores.
environment:
  sdk: ^3.12.2

dependencies:
  ffi: ^2.1.0
  # `flutter` is intentionally NOT a dependency: this package works under plain
  # Dart too. The plugin platforms below are only consulted by the Flutter tool.

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6

flutter:
  plugin:
    platforms:
      # ffiPlugin: true marks these as FFI-only implementations, so the Flutter
      # tool bundles the native artifacts without generating method-channel
      # registrant code.
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      windows:
        ffiPlugin: true
