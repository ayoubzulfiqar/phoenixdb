name: phoenixdb
description: >-
  ACID-compliant embedded database for Dart and Flutter. B+Tree storage with
  MVCC transactions, a write-ahead log, and HNSW vector search, written in Rust
  with dart:ffi. Optional SQL and a shared_preferences-style typed API.
version: 2.1.0
repository: https://github.com/ayoubzulfiqar/phoenixdb
issue_tracker: https://github.com/ayoubzulfiqar/phoenixdb/issues
documentation: https://github.com/ayoubzulfiqar/phoenixdb#readme

topics:
  - database
  - key-value
  - ffi
  - vector-search
  - sql

# Dart-only consumers (`dart pub add phoenixdb`) get the same package; the
# loader in lib/src/bindings.dart finds the native library on disk. Flutter
# consumers additionally get the platform folders below, which bundle or build
# the native library as part of the app.
#
# The `flutter:` bound must be present but LOOSE. Two opposing constraints:
#
#   * omit it entirely and pub rejects the package — `flutter.plugin.platforms`
#     below is only understood by Flutter >=1.10.0, so pub demands a bound that
#     excludes 1.9.x;
#   * make it tight (e.g. ">=3.10.0") and `dart pub get` fails for plain Dart
#     consumers with "Because phoenixdb requires the Flutter SDK, version
#     solving failed", even though nothing under lib/ imports package:flutter.
#
# ">=1.10.0" satisfies the plugin-platforms rule while staying permissive. The
# real floor is enforced by `sdk: ^3.12.2`: any Flutter shipping a Dart 3.12
# SDK is far newer than 1.10.
environment:
  sdk: ^3.12.2
  flutter: ">=1.10.0"

dependencies:
  ffi: ^2.1.0
  # `flutter` is intentionally NOT a dependency: this package works under plain
  # Dart too. The plugin platforms below are only consulted by the Flutter tool.

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6

flutter:
  plugin:
    platforms:
      # ffiPlugin: true marks these as FFI-only implementations, so the Flutter
      # tool bundles the native artifacts without generating method-channel
      # registrant code.
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      windows:
        ffiPlugin: true
