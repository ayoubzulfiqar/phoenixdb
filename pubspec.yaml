name: phoenixdb
description: >-
  ACID-compliant embedded key/value database engine with a B+Tree index, MVCC
  transactions and a write-ahead log, implemented in Rust and exposed to Dart
  through a zero-overhead dart:ffi layer.
version: 0.1.0
repository: https://github.com/phoenixdb/phoenixdb
issue_tracker: https://github.com/phoenixdb/phoenixdb/issues

topics:
  - database
  - key-value
  - ffi
  - storage
  - acid

environment:
  sdk: ^3.12.2

dependencies:
  ffi: ^2.1.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
