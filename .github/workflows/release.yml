name: Release

# Publishes to pub.dev on a version tag.
#
# The binaries are rebuilt from the tagged source rather than reused from a CI
# run, so what ships is provably built from what was tagged. Every shipped
# library is checked for the current ABI surface before publishing: PhoenixDB's
# Dart loader enforces an exact ABI match, so one stale binary means the
# package cannot open a database on that platform at all.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate without publishing
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: build ${{ matrix.triple }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true # a partial release is worse than none
      matrix:
        include:
          - { os: ubuntu-latest,  triple: x86_64-unknown-linux-gnu,  name: libphoenixdb.so }
          - { os: ubuntu-latest,  triple: aarch64-unknown-linux-gnu, name: libphoenixdb.so,   cross: true, neon: true }
          - { os: macos-latest,   triple: x86_64-apple-darwin,       name: libphoenixdb.dylib }
          - { os: macos-latest,   triple: aarch64-apple-darwin,      name: libphoenixdb.dylib, neon: true }
          - { os: windows-latest, triple: x86_64-pc-windows-msvc,    name: phoenixdb.dll }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - name: install cross linker (aarch64 linux)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p ~/.cargo
          printf '[target.aarch64-unknown-linux-gnu]\nlinker = "aarch64-linux-gnu-gcc"\n' \
            >> ~/.cargo/config.toml

      # SIMD policy, identical to build_native.yml — see that file's header for
      # the full reasoning. In short: `+neon` is safe to bake in because NEON
      # is baseline on AArch64, while `+avx2` is deliberately NOT baked in,
      # because a published binary compiled for AVX2 would SIGILL on pre-2013
      # x86 CPUs. The x86 AVX2 kernels are selected at runtime instead.
      - name: build
        working-directory: rust
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.neon && '-C target-feature=+neon' || '' }}
        run: cargo build --release --lib --features sql --target ${{ matrix.triple }}

      - name: verify ABI surface
        shell: bash
        run: tool/check_abi.sh "rust/target/${{ matrix.triple }}/release/${{ matrix.name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.triple }}
          path: rust/target/${{ matrix.triple }}/release/${{ matrix.name }}
          if-no-files-found: error

  android:
    name: build android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26d
      - run: cargo install cargo-ndk --locked

      # Split by ABI rather than one `cargo ndk -t ... -t ...` invocation,
      # because RUSTFLAGS is process-wide: a single call cannot give arm64-v8a
      # `+neon` while leaving armeabi-v7a without it. NEON is mandatory on
      # AArch64 but *optional* on ARMv7 and genuinely absent from some shipped
      # devices, so baking it into the 32-bit build would SIGILL there.
      - name: build arm64-v8a (NEON)
        working-directory: rust
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          RUSTFLAGS: -C target-feature=+neon
        run: |
          cargo ndk -t arm64-v8a -o ../android/src/main/jniLibs \
            build --release --lib --features sql

      - name: build armeabi-v7a, x86_64 and x86 (no NEON)
        working-directory: rust
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cargo ndk -t armeabi-v7a -t x86_64 -t x86 \
            -o ../android/src/main/jniLibs build --release --lib --features sql

      - name: verify the ABI surface in every ABI
        run: |
          tool/check_abi.sh \
            android/src/main/jniLibs/{arm64-v8a,armeabi-v7a,x86_64,x86}/libphoenixdb.so

      - uses: actions/upload-artifact@v4
        with:
          name: native-android
          path: android/src/main/jniLibs/
          if-no-files-found: error

  publish:
    name: publish to pub.dev
    runs-on: ubuntu-latest
    needs: [desktop, android]
    # Required for pub.dev's OIDC-based automated publishing.
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # Flutter, not standalone Dart: the plugin's `flutter:` bound (required
      # by flutter.plugin.platforms) makes `dart pub` refuse the package.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: stage binaries
        run: tool/stage_artifacts.sh artifacts

      # Staging overwrites the committed Android .so files with freshly built
      # ones, which leaves the checkout dirty and makes pub warn about
      # publishing from an unclean tree. The rebuilt binaries are exactly what
      # we intend to ship, so record them rather than leave the tree modified.
      - name: commit the rebuilt binaries
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- native android; then
            echo "binaries unchanged"
          else
            git add native android
            git commit -m "chore(release): rebuild native binaries for ${GITHUB_REF_NAME:-release}"
            echo "recorded rebuilt binaries"
          fi

      - name: no stale binaries
        run: tool/check_abi.sh --shipped

      # The tag must match the pubspec, or the wrong version gets published.
      - name: tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          pub="$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')"
          if [ "$tag" != "$pub" ]; then
            echo "::error::tag v$tag does not match pubspec version $pub"
            exit 1
          fi
          echo "version $pub"

      - run: flutter pub get
      - run: dart analyze
      - run: dart test

      - name: publish (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: flutter pub publish --dry-run

      - name: publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: flutter pub publish --force
