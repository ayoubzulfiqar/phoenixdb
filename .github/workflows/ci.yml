name: CI

# Runs on every push and PR. The `native` job is the one that matters for
# releases: it cross-builds all eight shipped binaries. PhoenixDB commits
# prebuilt libraries into the published package, so a stale binary is a
# release blocker rather than a cosmetic problem — the Dart loader enforces an
# exact ABI match and refuses to open a database against a mismatched library.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Fail the build on warnings in CI, matching the local verification workflow.
  RUSTFLAGS: -D warnings

jobs:
  # --------------------------------------------------------------------------
  # Fast feedback: lint, format, and the full Rust + Dart test suites.
  # --------------------------------------------------------------------------
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # Flutter, not standalone Dart. This package declares
      # `flutter.plugin.platforms`, which pub only accepts alongside a
      # `flutter:` bound in `environment:` — and that bound makes the package
      # require the Flutter SDK, so standalone `dart pub get` refuses it with
      # "Because phoenixdb requires the Flutter SDK, version solving failed".
      #
      # The two requirements are mutually exclusive: dropping the bound fixes
      # `dart pub get` but makes `pub publish` reject the package outright.
      # Keeping the bound is correct for a plugin, so CI uses `flutter pub`
      # throughout. Flutter bundles a Dart SDK, so `dart analyze` and
      # `dart test` still work once resolution has happened through Flutter.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: rustfmt
        working-directory: rust
        run: cargo fmt --all -- --check

      # Both feature configurations are checked deliberately: `default` is what
      # ships inside a Flutter app and `full` is what a server uses. A
      # feature-gate mistake shows up in only one of them.
      - name: clippy (default / lean)
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings

      - name: clippy (full)
        working-directory: rust
        run: cargo clippy --all-targets --features full -- -D warnings

      - name: test (default / lean)
        working-directory: rust
        run: cargo test

      - name: test (full)
        working-directory: rust
        run: cargo test --features full

      - name: build native library for Dart tests
        working-directory: rust
        run: cargo build --release --lib --features sql

      - name: stage native library
        shell: bash
        run: |
          # The Dart loader searches native/<triple>/ and native/.
          triple="$(rustc -vV | awk '/^host:/ {print $2}')"
          mkdir -p "native/$triple"
          case "$triple" in
            *windows*) name=phoenixdb.dll ;;
            *apple*)   name=libphoenixdb.dylib ;;
            *)         name=libphoenixdb.so ;;
          esac
          cp "rust/target/release/$name" "native/$triple/$name"

      - name: flutter pub get
        run: flutter pub get

      # The bound must stay: `flutter.plugin.platforms` above is only valid
      # alongside it, and pub refuses to publish the package without one. This
      # guard is the inverse of the earlier (wrong) one, which asserted the
      # bound must be absent — that fixed `dart pub get` and broke publishing.
      - name: plugin declares a flutter SDK bound
        shell: bash
        run: |
          if ! grep -qE '^\s+flutter:\s*"' pubspec.yaml; then
            echo '::error::pubspec environment: has no flutter bound, but'
            echo '::error::flutter.plugin.platforms requires one to publish.'
            exit 1
          fi
          # lib/ must still be Flutter-free: the bound is a packaging
          # requirement, not a licence to import package:flutter into a
          # library that plain Dart programs also use.
          for pkg in $(grep -rho "package:[a-z_]*" lib | sort -u); do
            case "$pkg" in
              package:flutter*)
                echo "::error::lib/ imports $pkg — the library must stay pure Dart"
                exit 1 ;;
            esac
          done
          echo "flutter bound present; lib/ is pure Dart"

      - name: dart analyze
        run: dart analyze

      - name: dart test
        run: dart test

      # Guards the exact bug that blocked the 2.0.0 release: the committed C
      # header must match what cbindgen generates from the current ffi.rs.
      - name: public C header is up to date
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          if ! git diff --quiet native/include/phoenixdb.h; then
            echo "::error::native/include/phoenixdb.h is stale — commit the regenerated header"
            git diff native/include/phoenixdb.h
            exit 1
          fi
          echo "header is current"

  # --------------------------------------------------------------------------
  # Desktop binaries. Built on their native runners rather than cross-compiled:
  # Apple's SDK licence forbids cross-linking macOS from Linux, and a native
  # build is the configuration users actually run.
  # --------------------------------------------------------------------------
  native-desktop:
    name: native ${{ matrix.triple }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  triple: x86_64-unknown-linux-gnu,  name: libphoenixdb.so }
          - { os: ubuntu-latest,  triple: aarch64-unknown-linux-gnu, name: libphoenixdb.so,   cross: true }
          - { os: macos-latest,   triple: x86_64-apple-darwin,       name: libphoenixdb.dylib }
          - { os: macos-latest,   triple: aarch64-apple-darwin,      name: libphoenixdb.dylib }
          - { os: windows-latest, triple: x86_64-pc-windows-msvc,    name: phoenixdb.dll }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: ${{ matrix.triple }}

      # aarch64 Linux is the only desktop target without a native runner.
      - name: install cross linker (aarch64 linux)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p ~/.cargo
          printf '[target.aarch64-unknown-linux-gnu]\nlinker = "aarch64-linux-gnu-gcc"\n' \
            >> ~/.cargo/config.toml

      # `sql` is enabled in shipped binaries: `phoenix_sql_query` and
      # `phoenix_has_sql` are part of ABI v2, and omitting them would make the
      # loader reject the library.
      - name: build
        working-directory: rust
        run: cargo build --release --lib --features sql --target ${{ matrix.triple }}

      # A binary missing the v2 symbols would fail at load time on a user's
      # machine. Catching it here is the entire point of this job.
      - name: verify ABI v2 surface is present
        shell: bash
        run: tool/check_abi.sh "rust/target/${{ matrix.triple }}/release/${{ matrix.name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.triple }}
          path: rust/target/${{ matrix.triple }}/release/${{ matrix.name }}
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Android: four ABIs, built with the NDK via cargo-ndk. These ship inside the
  # published package (android/src/main/jniLibs/), so they are as
  # release-critical as the desktop binaries.
  # --------------------------------------------------------------------------
  native-android:
    name: native android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: android

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26d

      - name: install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: build all four ABIs
        working-directory: rust
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cargo ndk \
            -t arm64-v8a -t armeabi-v7a -t x86_64 -t x86 \
            -o ../android/src/main/jniLibs \
            build --release --lib --features sql

      - name: verify ABI v2 surface in every ABI
        run: |
          tool/check_abi.sh \
            android/src/main/jniLibs/{arm64-v8a,armeabi-v7a,x86_64,x86}/libphoenixdb.so

      - uses: actions/upload-artifact@v4
        with:
          name: native-android
          path: android/src/main/jniLibs/
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Packaging gate. Collects every binary and runs the real publish validation,
  # so a release cannot go out with a stale or missing library.
  # --------------------------------------------------------------------------
  package:
    name: package (publish dry-run)
    runs-on: ubuntu-latest
    needs: [test, native-desktop, native-android]
    steps:
      - uses: actions/checkout@v4
      # Flutter, not standalone Dart — see the note on the `test` job: the
      # plugin's `flutter:` bound makes `dart pub` refuse the package.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: stage binaries into the package layout
        run: tool/stage_artifacts.sh artifacts

      - name: every shipped binary carries the v2 ABI
        run: tool/check_abi.sh --shipped

      - run: flutter pub get
      - name: publish dry-run
        run: flutter pub publish --dry-run
