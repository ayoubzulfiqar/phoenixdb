name: Feature request
description: Suggest an improvement or a new capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The API or behavior you would like. A code sketch helps.
      render: dart
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use now, or other designs you thought about.
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Key/value store and transactions
        - SQL
        - Vector search
        - Document collections and hybrid search
        - AI toolkit (package:phoenixdb/ai.dart)
        - Preferences (PhoenixPrefs)
        - Platforms and packaging
        - Rust crate or C ABI
        - Other
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I would be willing to open a pull request for this.
